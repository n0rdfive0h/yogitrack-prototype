<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>YogiTrack • Messaging</title>
    <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="layout--sidebar">
        <aside class="sidebar">
            <a class="logo-wrap" href="dashboard.html">
                <img src="../images/Logo.png" alt="YogaTrack Logo" class="logo">
            </a>
            <nav class="nav">
                <a href="instructor.html">Instructors</a>
                <a href="package.html">Packages</a>
                <a href="class.html">Class Schedule</a>
                <a href="customer.html">Customers</a>
                <a href="checkIn.html">Check-ins</a>
                <a href="reports.html">Reports</a>
                <a href="messaging.html">Messaging</a>
                <a href="users.html">Users</a>
                <a onclick="logout()" style="cursor: pointer;">Log Out</a>
            </nav>
        </aside>

        <main class="layout--center">
            <form class="card" id="messagingForm">
                <h2>Messaging</h2>

                <!-- Recipient Selection -->
                <label>Recipient
                    <select name="recipient" id="recipientSelect" class="form-input">
                        <option value="all"> -- Send to All Opted-In Customers --</option>
                    </select>
                </label>

                <!-- Subject -->
                <label>Subject
                    <input type="text" name="subject" id="subject" class="form-input"/>
                </label>

                <!-- Message -->
                <label>Message
                    <textarea name="message" id="message" rows="6" class="form-input"></textarea>
                </label>

                <!-- Action buttons -->
                <div class="btn-row">
                    <button type="button" class="btn btn--primary" id="sendBtn">Send</button>
                    <button type="button" class="btn" id="clearBtn">Clear</button>
                    <a href="dashboard.html" class="btn">Exit</a>
                </div>

            </form>
        </main>

        <script src="../js/auth.js"></script>
        <script src="../js/messaging.js"></script>
    </body>
</html>
