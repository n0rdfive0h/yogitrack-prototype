<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>YogiTrack • Users</title>
    <link rel="stylesheet" href="../css/style.css">
    </head>
    <body class="layout--sidebar">
        <aside class="sidebar">
            <a class="logo-wrap" href="dashboard.html">
                <img src="../images/Logo.png" alt="YogaTrack Logo" class="logo">
            </a>
            <nav class="nav">
                <a href="instructor.html">Instructors</a>
                <a href="package.html">Packages</a>
                <a href="class.html">Class Schedule</a>
                <a href="customer.html">Customers</a>
                <a href="checkIn.html">Check-ins</a>
                <a href="reports.html">Reports</a>
                <a href="messaging.html">Messaging</a>
                <a href="users.html">Users</a>
                <a onclick="logout()" style="cursor: pointer;">Log Out</a>
            </nav>
        </aside>

        <main class="layout--center">
            <form class="card" id="userForm">
                <h2>User Management</h2>

                <!-- User ID dropdown -->
                <label id="userIdLabel" for="userIdSelect">User ID
                    <select name="userId" id="userIdSelect" class="form-input">
                        <option value=""> -- Select User --</option>
                    </select>
                </label>

                <!-- Toggle for add mode -->
                <label id="userIdTextLabel" style="display: none;">User ID
                    <input id="userIdText" type="text" name="userId" readonly/>
                </label>

                <div class="grid-2">
                    <label>First Name
                        <input type="text" name="firstName" class="form-input"/>
                    </label>
                    <label>Last Name
                        <input type="text" name="lastName" class="form-input"/>
                    </label>
                </div>

                <label>Email
                    <input type="email" name="email" class="form-input"/>
                </label>

                <label>Password
                    <input type="password" name="password" class="form-input"/>
                </label>

                <label>Role
                    <select name="role" class="form-input">
                        <option value="manager">Manager</option>
                        <option value="instructor">Instructor</option>
                    </select>
                </label>

                <label>Deactivated
                    <input type="checkbox" name="deactivated" id="deactivated">
                </label>

                <!-- Action buttons -->
                <div class="btn-row">
                    <button type="button" class="btn" id="searchBtn">Search</button>
                    <button type="button" class="btn btn--primary" id="addBtn">Add New</button>
                    <button type="button" class="btn btn--primary" id="editBtn">Edit</button>
                    <button type="button" class="btn" id="saveBtn">Save</button>
                    <button type="button" class="btn btn--danger" id="deleteBtn">Delete</button>
                    <a href="dashboard.html" class="btn">Exit</a>
                </div>

            </form>
        </main>

        <script src="../js/auth.js"></script>
        <script src="../js/users.js"></script>
    </body>
</html>
