<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YogiTrack • Welcome</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="layout--center">
  <main class="card card--wide text--center">
    <img src="images/Logo.png" alt="YogiTrack Logo" class="logo">
    <h1>Welcome to YogiTrack</h1>
    <p>Your all-in-one studio management companion.</p>

    <label>Email
        <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" style="width: 300px;"/>
    </label>

    <label>Password
        <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" style="width: 300px;"/>
    </label>

    <button type="button" class="btn btn--primary" id="loginBtn">Log In</button>
    <p id="loginError" style="color: red; display: none;">Invalid email or password.</p>

  </main>
  <script src="js/login.js"></script>
</body>
</html>
